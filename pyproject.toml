[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "words-voice"
version = "0.1.0"
description = "Words vs. Voice: Emotion-Aware Customer Review Analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.5", "soundfile>=0.12", "librosa>=0.10", "torch>=2.3", "transformers>=4.45,<6", "streamlit>=1.38", "pandas>=2.2"]
[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
dev = ["pytest>=8"]
[project.scripts]
words-voice = "words_voice.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
